<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Roots Academy</title>
<script src="exceljs.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';document.head.appendChild(s)"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#1c2333;--mute:#6a7286;--line:#e2e0d8;--brand:#2a3f8f;--on:#fff;--g:#1b7f46;--gb:#dcf2e4;--r:#c22d2d;--rb:#fbe1df;--o:#b85f00;--ob:#fde8c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--card:#1b202b;--ink:#eceef4;--mute:#9aa2b5;--line:#2c3342;--brand:#6c86e6;--on:#0f1320;--g:#5fd28d;--gb:#173a27;--r:#ff8a80;--rb:#44201f;--o:#ffb255;--ob:#432c0e}}
:root[data-theme="dark"]{--bg:#11141b;--card:#1b202b;--ink:#eceef4;--mute:#9aa2b5;--line:#2c3342;--brand:#6c86e6;--on:#0f1320;--g:#5fd28d;--gb:#173a27;--r:#ff8a80;--rb:#44201f;--o:#ffb255;--ob:#432c0e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 Hind,system-ui,sans-serif;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:5;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;font-weight:700}
header input[type=month]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}
.back{border:0;background:none;font-size:15px;color:var(--brand);font-weight:600;padding:6px 0}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.row{display:flex;gap:8px;margin-bottom:10px}
.row input,.row select,.f input,.f select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.btn{border:0;background:var(--brand);color:var(--on);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--r);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.paid{border-left-color:var(--g)}.card.unpaid{border-left-color:var(--r)}.card.pending{border-left-color:var(--o)}
.top{display:flex;align-items:center;gap:10px}
.top .n{flex:1;min-width:0}
.name{font-weight:700;font-size:17px}
.sub{color:var(--mute);font-size:14px;display:flex;gap:12px;flex-wrap:wrap}
.pill{border:0;border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;min-width:84px}
.pill.paid{background:var(--gb);color:var(--g)}.pill.unpaid{background:var(--rb);color:var(--r)}.pill.pending{background:var(--ob);color:var(--o)}
.link{border:0;background:none;color:var(--mute);font-size:13px;padding:6px 0 0}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.cnt{display:flex;gap:12px;font-size:14px;margin-top:6px}
.cnt b{font-weight:700}.P{color:var(--g)}.A{color:var(--r)}.L{color:var(--o)}
.qa{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:13px;color:var(--mute)}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:34px;font-weight:700}
.qa button.sel.P{background:var(--gb)}.qa button.sel.A{background:var(--rb)}.qa button.sel.L{background:var(--ob)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--mute)}
.d{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mute);padding:0}
.d b{font-size:17px;line-height:1}
.d.P{background:var(--gb);border-color:var(--g)}.d.A{background:var(--rb);border-color:var(--r)}.d.L{background:var(--ob);border-color:var(--o)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;padding:14px 0;font-weight:600;color:var(--mute)}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:19px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:14px;color:var(--mute)}
.acts{display:flex;gap:8px;justify-content:flex-end}
.lock{max-width:360px;margin:0 auto;padding:56px 20px}.lock h1{font-size:24px;margin:0 0 14px}.lock .btn{width:100%}
.err{color:var(--r);min-height:22px;font-size:14px;margin-bottom:8px}
body:not([data-role=admin]) .link,body:not([data-role=admin]) .row .btn,body:not([data-role=admin]) .qa{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY='coaching-v1',now=new Date();
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
var S={students:[],teachers:[],month:ym(now),tab:'students',q:'',board:'All',st:'All',open:null,sheet:null,notices:[],cfg:{name:'THE ROOTS ACADEMY',upi:'',pin:''},user:null,flash:'',lock:{role:'admin',err:'',fails:0,until:0}};
var LBL={paid:'Paid',pending:'Pending',unpaid:'Unpaid'},NEXT={unpaid:'pending',pending:'paid',paid:'unpaid'};
var AN={'':'P',P:'A',A:'L',L:''};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){
 try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);S.students=d.students||[];S.teachers=d.teachers||[];S.notices=d.notices||[];S.cfg=d.cfg||S.cfg;if(!S.cfg.name)S.cfg.name='THE ROOTS ACADEMY';S.students.concat(S.teachers).forEach(function(o){if(!o.ch)o.ch=H(o.id+'1234');if(o.id.indexOf('TRA-')!==0)o.id='TRA-'+o.id});return}}catch(e){}
 var p={};p[S.month]='paid';var q={};q[S.month]='pending';
 S.students=[{id:'TRA-S001',name:'Aarav Kumar',cls:'10',board:'CBSE',fee:1500,mode:{},ch:H('S0011234'),pay:p},{id:'TRA-S002',name:'Priya Sinha',cls:'9',board:'BSEB',fee:1200,mode:{},ch:H('S0021234'),pay:q},{id:'TRA-S003',name:'Rohan Das',cls:'8',board:'ICSE',fee:1000,mode:{},ch:H('S0031234'),pay:{}}];
 S.teachers=[{id:'TRA-T001',name:'Anita Sharma',att:{},ch:H('T0011234')},{id:'TRA-T002',name:'Vikram Singh',att:{},ch:H('T0021234')}];
 S.notices=[{id:1,t:'Fee reminder',b:'Monthly fees are due by the 10th.',to:'All',d:'17 Oct'}];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({students:S.students,teachers:S.teachers,notices:S.notices,cfg:S.cfg}))}catch(e){}}
function nextId(pre,list){var m=0;list.forEach(function(x){m=Math.max(m,parseInt(x.id.replace(/\D/g,''),10)||0)});return'TRA-'+pre+String(m+1).padStart(3,'0')}
function stOf(s){return(s.pay&&s.pay[S.month])||'unpaid'}
function mlabel(){var a=S.month.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}
function tAtt(t){return(t.att&&t.att[S.month])||{}}
function counts(t){var c={P:0,A:0,L:0},a=tAtt(t);for(var k in a)if(c[a[k]]!==undefined)c[a[k]]++;return c}
function filtered(){
 var q=S.q.trim().toLowerCase();
 return S.students.filter(function(s){
  return(S.board==='All'||s.board===S.board)&&(S.st==='All'||stOf(s)===S.st)&&(!q||s.name.toLowerCase().indexOf(q)>-1||s.id.toLowerCase().indexOf(q)>-1)});
}
function listHTML(){
 var l=filtered();
 if(!l.length)return'<div class="empty">No students match. Add a student or change the filters.</div>';
 return l.map(function(s){var st=stOf(s);
  return'<div class="card '+st+'"><div class="top"><div class="n"><div class="name">'+esc(s.name)+'</div><div class="sub"><span>'+s.id+'</span><span>Class '+esc(s.cls)+'</span><span>'+s.board+'</span>'+(st==='paid'&&(s.mode||{})[S.month]?'<span>'+s.mode[S.month]+'</span>':'')+(s.fee?'<span>₹'+s.fee+'</span>':'')+'</div></div>'
  +'<button class="pill '+st+'" data-act="pay" data-id="'+s.id+'">'+LBL[st]+'</button></div>'
  +'<button class="link" data-act="del" data-id="'+s.id+'">Remove student</button></div>'}).join('');
}
function studentsHTML(){
 var n={paid:0,pending:0,unpaid:0};S.students.forEach(function(s){n[stOf(s)]++});
 var chips=[['All','All '+S.students.length],['paid','Paid '+n.paid],['pending','Pending '+n.pending],['unpaid','Unpaid '+n.unpaid]].map(function(c){
  return'<button class="chip'+(S.st===c[0]?' on':'')+'" data-act="flt" data-v="'+c[0]+'">'+c[1]+'</button>'}).join('');
 var bo=['All','CBSE','ICSE','BSEB'].map(function(b){return'<option'+(S.board===b?' selected':'')+'>'+b+'</option>'}).join('');
 return'<div class="chips">'+chips+'</div><div class="row"><input id="q" type="search" placeholder="Search name or ID" value="'+esc(S.q)+'"><select id="bf" aria-label="Board">'+bo+'</select></div>'
 +'<div class="row"><button class="btn" style="flex:1" data-act="add">Add student</button></div><div id="list">'+listHTML()+'</div>';
}
function teachersHTML(){
 var today=ym(now)===S.month,dk=String(now.getDate());
 var h='<div class="row"><button class="btn" style="flex:1" data-act="add">Add teacher</button></div>';
 if(!S.teachers.length)return h+'<div class="empty">No teachers yet. Add a teacher to start marking attendance.</div>';
 return h+S.teachers.filter(function(t){return S.user.role==='admin'||t.id===S.user.id}).map(function(t){var c=counts(t),cur=tAtt(t)[dk]||'';
  var qa=today?'<div class="qa">Today '+['P','A','L'].map(function(v){return'<button class="'+v+(cur===v?' sel':'')+'" data-act="qa" data-id="'+t.id+'" data-v="'+v+'">'+v+'</button>'}).join('')+'</div>':'';
  return'<div class="card" style="border-left-color:var(--brand)"><div class="top"><div class="n"><div class="name">'+esc(t.name)+'</div><div class="sub"><span>'+t.id+'</span></div>'
  +'<div class="cnt"><span class="P">Present <b>'+c.P+'</b></span><span class="A">Absent <b>'+c.A+'</b></span><span class="L">Leave <b>'+c.L+'</b></span></div></div>'
  +'<button class="btn ghost" data-act="open" data-id="'+t.id+'">Month view</button></div>'+qa
  +'<button class="link" data-act="del" data-id="'+t.id+'">Remove teacher</button></div>'}).join('');
}
function detailHTML(){
 var t=S.teachers.filter(function(x){return x.id===S.open})[0];if(!t)return'';
 var a=S.month.split('-'),y=+a[0],m=+a[1],days=new Date(y,m,0).getDate(),off=new Date(y,m-1,1).getDay(),att=tAtt(t),c=counts(t);
 var g=['S','M','T','W','T','F','S'].map(function(d){return'<div class="wd">'+d+'</div>'}).join('');
 for(var i=0;i<off;i++)g+='<div></div>';
 for(var d=1;d<=days;d++){var v=att[d]||'';g+='<button class="d '+v+'" data-act="att" data-id="'+t.id+'" data-d="'+d+'"><b>'+d+'</b>'+(v||'&nbsp;')+'</button>'}
 return'<div class="name" style="font-size:20px">'+esc(t.name)+'</div><div class="sub" style="margin-bottom:6px"><span>'+t.id+'</span><span>'+mlabel()+'</span></div>'
 +'<div class="cnt" style="margin-bottom:14px"><span class="P">Present <b>'+c.P+'</b></span><span class="A">Absent <b>'+c.A+'</b></span><span class="L">Leave <b>'+c.L+'</b></span></div>'
 +'<div class="grid">'+g+'</div><p class="sub" style="margin-top:12px">Tap a day to switch between P (present), A (absent), L (leave) and blank.</p>';
}
function sheetHTML(){
 var s=S.sheet;if(!s)return'';var xs=extraSheet(s);if(xs)return xs;
 if(s.type==='del'){var isS=s.id.charAt(0)==='S',o=(isS?S.students:S.teachers).filter(function(x){return x.id===s.id})[0];
  return'<div class="ov"><div class="sheet"><h2>Remove '+(o?esc(o.name):s.id)+'?</h2><p class="sub">This deletes '+(isS?'their payment history.':'their attendance records.')+' It can’t be undone.</p><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn danger" data-act="confirmDel">Remove</button></div></div></div>'}
 if(s.type==='student'){
  var cl='';for(var i=1;i<=12;i++)cl+='<option>'+i+'</option>';
  return'<div class="ov"><div class="sheet"><h2>Add student</h2><div class="f">Name<input id="f-name" autocomplete="off"></div><div class="f">Class<select id="f-cls">'+cl+'</select></div><div class="f">Board<select id="f-board"><option>CBSE</option><option>ICSE</option><option>BSEB</option></select></div><div class="f">Monthly fee (₹)<input id="f-fee" type="number" inputmode="numeric" min="0"></div><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveAdd">Save student</button></div></div></div>'}
 return'<div class="ov"><div class="sheet"><h2>Add teacher</h2><div class="f">Name<input id="f-name" autocomplete="off"></div><div class="acts"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="saveAdd">Save teacher</button></div></div></div>';
}
function render0(){
 var head=S.open?'<button class="back" data-act="back">Back</button><h1></h1>':'<h1>'+(S.tab==='students'?'Students':'Teachers')+'</h1>';
 var body=S.open?detailHTML():(S.tab==='students'?studentsHTML():teachersHTML());
 var nav=S.open?'':'<nav><button class="'+(S.tab==='students'?'on':'')+'" data-act="tab" data-v="students">Students</button><button class="'+(S.tab==='teachers'?'on':'')+'" data-act="tab" data-v="teachers">Teachers</button></nav>';
 document.getElementById('app').innerHTML='<header>'+head+'<input type="month" id="mo" value="'+S.month+'" aria-label="Month"></header><main>'+body+'</main>'+nav+sheetHTML();
 var f=document.getElementById('f-name');if(f)f.focus();
}
function setAtt(t,d,v){t.att=t.att||{};t.att[S.month]=t.att[S.month]||{};if(v)t.att[S.month][d]=v;else delete t.att[S.month][d]}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,id=b.dataset.id;if(act2(a,b,id)){render();return}
 if(a==='tab'){S.tab=b.dataset.v}
 else if(a==='flt'){S.st=b.dataset.v}
 else if(a==='pay'){var s=S.students.filter(function(x){return x.id===id})[0];s.pay=s.pay||{};s.pay[S.month]=NEXT[stOf(s)];save()}
 else if(a==='open'){S.open=id}
 else if(a==='back'){S.open=null}
 else if(a==='att'){var t=S.teachers.filter(function(x){return x.id===id})[0];setAtt(t,b.dataset.d,AN[tAtt(t)[b.dataset.d]||'']);save()}
 else if(a==='qa'){var t2=S.teachers.filter(function(x){return x.id===id})[0],k=String(now.getDate());setAtt(t2,k,tAtt(t2)[k]===b.dataset.v?'':b.dataset.v);save()}
 else if(a==='add'){S.sheet={type:S.tab==='students'?'student':'teacher'}}
 else if(a==='del'){S.sheet={type:'del',id:id}}
 else if(a==='close'){S.sheet=null}
 else if(a==='confirmDel'){var did=S.sheet.id;S.students=S.students.filter(function(x){return x.id!==did});S.teachers=S.teachers.filter(function(x){return x.id!==did});S.sheet=null;save()}
 else if(a==='saveAdd'){
  var name=document.getElementById('f-name').value.trim();if(!name){document.getElementById('f-name').focus();return}
  if(S.sheet.type==='student')S.students.push({id:nextId('S',S.students),name:name,cls:document.getElementById('f-cls').value,board:document.getElementById('f-board').value,fee:+document.getElementById('f-fee').value||0,mode:{},pay:{}});
  else S.teachers.push({id:nextId('T',S.teachers),name:name,att:{}});
  var nu=S.sheet.type==='student'?S.students[S.students.length-1]:S.teachers[S.teachers.length-1],cd=newCode(nu);S.sheet={type:'code',id:nu.id,name:nu.name,code:cd};save()}
 render();
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;document.getElementById('list').innerHTML=listHTML()}});
document.addEventListener('change',function(e){
 if(e.target.id==='bf'){S.board=e.target.value;render()}
 if(e.target.id==='mo'&&e.target.value){S.month=e.target.value;render()}
});
function H(s){var a=0xdeadbeef,b=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
function newCode(o){var c=String(Math.floor(1000+Math.random()*9000));o.ch=H(o.id.replace('TRA-','')+c);return c}
function csv(rows){return'\ufeff'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n')}
function b64(buf){var u=new Uint8Array(buf),t='',i;for(i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)}
function saveFile(name,text,mt){
 var C=window.Capacitor,P=C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins;
 if(P&&P.Filesystem&&P.Share){
  var o=typeof text==='string'?{data:text,encoding:'utf8'}:{data:b64(text)};
  P.Filesystem.writeFile({path:name,data:o.data,encoding:o.encoding,directory:'CACHE'}).then(function(r){return P.Share.share({title:name,url:r.uri,dialogTitle:'Save or share'})}).catch(function(){});return}
 var u=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
 Promise.resolve(u).then(function(d){
  if(d)return d.save({filename:name,data:text});
  var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([text],{type:mt||'text/csv'}));l.download=name;document.body.appendChild(l);l.click();l.remove()
 }).catch(function(){})
}
function doExport(a,m){if(window.ExcelJS){xlExport(a,m);return}
 var p=m.split('-'),n=new Date(+p[0],+p[1],0).getDate(),inst=(S.cfg.name||'Academy').replace(/\W+/g,'-'),rows;
 if(a==='expS'){rows=[['ID','Name','Class','Board','Monthly fee','Status '+m,'Payment mode']].concat(S.students.map(function(s){var st=(s.pay&&s.pay[m])||'unpaid';return[s.id,s.name,s.cls,s.board,s.fee||0,LBL[st],st==='paid'?((s.mode||{})[m]||''):'']}));saveFile(inst+'-students-'+m+'.csv',csv(rows))}
 else{var hd=['ID','Name'];for(var d=1;d<=n;d++)hd.push(d);hd.push('Present','Absent','Leave');
  rows=[hd].concat(S.teachers.map(function(t){var at=(t.att&&t.att[m])||{},r=[t.id,t.name],c={P:0,A:0,L:0};for(var k=1;k<=n;k++){r.push(at[k]||'');if(c[at[k]]!==undefined)c[at[k]]++}return r.concat([c.P,c.A,c.L])}));saveFile(inst+'-teacher-attendance-'+m+'.csv',csv(rows))}
}
function xlExport(a,m){
 var p=m.split('-'),n=new Date(+p[0],+p[1],0).getDate(),inst=S.cfg.name||'Academy',isS=a==='expS',wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(isS?'Fees':'Attendance'),i,
 lab=new Date(+p[0],+p[1]-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'}),
 ln={style:'thin',color:{argb:'FFBBBBBB'}},bd={top:ln,left:ln,bottom:ln,right:ln},
 fl=function(c){return{type:'pattern',pattern:'solid',fgColor:{argb:c},bgColor:{argb:c}}},
